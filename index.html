<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data Leads Properti</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --border-color: #e0e0e0;
            --bg-card: #f8f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 4px;
            font-size: 13px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f1f3f5;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
            color: #555;
        }

        .save-top-btn {
            background: #2481cc;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .sub-header {
            display: flex;
            justify-content: flex-end;
            padding: 6px 10px 0 10px;
        }

        .code-badge {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            font-size: 11px;
            color: #333;
            border: 1px dashed #ced4da;
        }

        .section {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 6px;
            color: #1a1a1a;
            font-size: 12px;
        }

        .card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
        }

        .form-group {
            margin-bottom: 6px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 11px;
            color: #222;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .form-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .form-col {
            flex: 1;
        }

        input[type="text"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
            background: #fff;
        }

        textarea {
            resize: vertical;
            height: 50px;
        }

        textarea[readonly] {
            background-color: #f1f3f5;
            color: #495057;
        }

        .toggle-btn-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            margin: 2px 0;
            user-select: none;
            background: transparent;
            border: none;
            width: 100%;
        }

        .toggle-btn-text .toggle-label {
            font-size: 12px;
            font-weight: normal;
            color: #222;
            line-height: 1;
        }

        .toggle-btn-text .wedge-icon {
            font-size: 14px;
            line-height: 1;
            color: #333;
            font-weight: bold;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px;
            max-height: 140px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 6px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: normal;
            cursor: pointer;
        }

        .radio-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: normal;
            cursor: pointer;
            white-space: nowrap;
        }

        .radio-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px;
            width: 100%;
        }

        /* Master Grid 4 Kolom dengan Lebar Kolom ke-2 Disesuaikan untuk Mencegah Tumpang Tindih */
        .radio-grid-4 {
            display: grid;
            grid-template-columns: minmax(50px, 1fr) minmax(95px, 1.2fr) minmax(60px, 1fr) minmax(60px, 1fr);
            gap: 4px;
            width: 100%;
        }

        .disabled-section {
            opacity: 0.4;
            pointer-events: none;
        }

        .btn-row {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            margin-bottom: 6px;
        }

        .action-btn {
            width: 40%;
            max-width: 150px;
            padding: 5px 8px;
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            font-size: 11px;
            box-sizing: border-box;
        }

        .hint-text {
            font-size: 10px;
            color: #d97706;
            margin-top: 2px;
            font-weight: 500;
        }

        .preview-box {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        .location-info {
            font-size: 11px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            color: #333;
        }

        .location-row {
            display: flex;
            align-items: flex-start;
            gap: 4px;
        }

        .gmaps-link-container {
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .jalan-input-wrapper {
            margin-top: 2px;
            padding-left: 56px;
        }

        .footer-action {
            padding: 10px;
            background: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">

        <span>Form Data Leads Properti</span>

                    <option value="VI">Villa</option>

            <div class="form-group">

    <!-- 2. DATA PEMILIK & MAKELAR -->

                        <label class="checkbox-label"><input type="checkbox" name="fasilitasRumah" value="Garasi Motor" onchange="updateRingkasan()"> Garasi Motor</label>
                        <label class="checkbox-label"><input type="checkbox" name="fasilitasRumah" value="Halaman Depan" onchange="updateRingkasan()"> Halaman Depan</label>
                        <label class="checkbox-label"><input type="checkbox" name="fasilitasRumah" value="Halaman Belakang" onchange="updateRingkasan()"> Halaman Belakang</label>
                        <label class="checkbox-label"><input type="checkbox" name="fasilitasRumah" value="Ruang Tamu" onchange="updateRingkasan()"> Ruang Tamu</label>
                        <label class="checkbox-label"><input type="checkbox" name="fasilitasRumah" value="Ruang Keluarga" onchange="updateRingkasan()"> Ruang Keluarga</label>
                        <label class="checkbox-label"><input type="checkbox" name="fasilitasRumah" value="Ruang Makan" onchange="updateRingkasan()"> Ruang Makan</label>
                        <label class="checkbox-label"><input type="checkbox" name="fasilitasRumah" value="Ruang Kerja" onchange="updateRingkasan()"> Ruang Kerja</label>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentKota = "";
    let currentKec = "";
    let currentKel = "";

    function updateCodePrefix() {
        const sub = document.getElementById('subKategori').value;
        const statusEl = document.querySelector('input[name="statusProperti"]:checked');
        const statusLetter = statusEl ? statusEl.value.charAt(0).toUpperCase() : 'B';
        document.getElementById('displayCode').innerText = `KODE: ${sub}-${statusLetter}0001`;
    }

    function formatHarga(input) {
        let cursorPosition = input.selectionStart;
        let originalLength = input.value.length;

        let val = input.value.replace(/^Rp\s?/, '').split(',')[0].replace(/[^0-9]/g, '');

        if (val === '') {
            input.value = '';
            return;
        }

        let num = parseInt(val, 10);
        let formatted = num.toLocaleString('id-ID');
        input.value = 'Rp' + formatted + ',00';

        let newLength = input.value.length;
        cursorPosition = cursorPosition + (newLength - originalLength);
        
        if (cursorPosition > input.value.length - 3) {
            cursorPosition = input.value.length - 3;
        }
        if (cursorPosition < 0) cursorPosition = 0;
        
        input.setSelectionRange(cursorPosition, cursorPosition);
    }

    function toggleDetails(show) {
        const extra = document.getElementById('extraDetails');
        const btnOpen = document.getElementById('btnOpenDetails');
        if (show) {
            extra.style.display = 'block';
            btnOpen.style.display = 'none';
        } else {
            extra.style.display = 'none';
            btnOpen.style.display = 'flex';
        }
    }

    function updateRingkasan() {
        let parts = [];

        const fields = [
            { id: 'sertifikasi', label: 'Sertifikasi' },
            { id: 'luasTanah', label: 'Luas Tanah' },
            { id: 'luasBangunan', label: 'Luas Bangunan' },
            { id: 'jumlahLantai', label: 'Jumlah Lantai' },
            { id: 'kamarTidur', label: 'Kamar Tidur' },
            { id: 'kamarMandi', label: 'Kamar Mandi' }
        ];

        fields.forEach(f => {
            let val = document.getElementById(f.id).value.trim();
            if (val) parts.push(`${f.label}: ${val}`);
        });

        const fRumah = Array.from(document.querySelectorAll('input[name="fasilitasRumah"]:checked')).map(cb => cb.value);
        if (fRumah.length > 0) parts.push(`Fasilitas Rumah: ${fRumah.join(', ')}`);

        const fUmumSosial = Array.from(document.querySelectorAll('input[name="fasilitasUmumSosial"]:checked')).map(cb => cb.value);
        if (fUmumSosial.length > 0) parts.push(`Fasilitas Umum/Sosial: ${fUmumSosial.join(', ')}`);

        const fPublik = Array.from(document.querySelectorAll('input[name="fasilitasPublik"]:checked')).map(cb => cb.value);
        if (fPublik.length > 0) parts.push(`Fasilitas Publik: ${fPublik.join(', ')}`);

        document.getElementById('ringkasan').value = parts.length > 0 ? parts.join(', ') + '.' : '';
    }

    function toggleStatusTracking() {
        const statusListing = document.querySelector('input[name="statusListing"]:checked').value;
        const dependentContainer = document.getElementById('trackingDependentFields');
        const inputs = dependentContainer.querySelectorAll('input');

        if (statusListing === 'Sold') {
            dependentContainer.classList.add('disabled-section');
            inputs.forEach(input => input.disabled = true);
        } else {
            dependentContainer.classList.remove('disabled-section');
            inputs.forEach(input => input.disabled = false);
        }
    }

    function renderWilayahText() {
        const wilayahText = document.getElementById('wilayahText');
        const jalanInput = document.getElementById('inputJalan').value.trim();

        if (!currentKota && !currentKec && !currentKel && !jalanInput) {
            wilayahText.innerText = '-';
            return;
        }

        let barisWilayah = `Kota/Kabupaten ${currentKota || '-'}, Kec. ${currentKec || '-'}, Kel. ${currentKel || '-'}`;
        let barisJalan = jalanInput ? `Jl. ${jalanInput}` : '';

        wilayahText.innerHTML = `${barisWilayah}${barisJalan ? `, ${barisJalan}` : ''}`;
    }

    function updateJalanManual() {
        renderWilayahText();
    }

    function setLocationData(lat, lng, kota, kec, kel, jalanDefault) {
        const statusTitle = document.getElementById('statusTitle');
        const gmapsLink = document.getElementById('gmapsLink');

        const url = `https://maps.google.com/?q=${lat},${lng}`;

        statusTitle.innerText = '✅ Lokasi Berhasil ditambahkan';
        
        gmapsLink.href = url;
        gmapsLink.innerText = url;
        gmapsLink.style.display = 'inline';

        currentKota = kota;
        currentKec = kec;
        currentKel = kel;

        if (jalanDefault && !document.getElementById('inputJalan').value) {
            document.getElementById('inputJalan').value = jalanDefault;
        }

        renderWilayahText();
    }

    function getGpsLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                setLocationData(lat, lng, "Serang", "Cipocok Jaya", "Banjaragung", "Raya Petir - Serang");
            }, () => { alert('Gagal mendeteksi GPS.'); });
        } else { alert('Geolocation tidak didukung.'); }
    }

    function submitData() {
        const statusListingVal = document.querySelector('input[name="statusListing"]:checked').value;
        
        const payload = {
            kode_data: document.getElementById('displayCode').innerText.replace('KODE: ', ''),
            sub_kategori: document.getElementById('subKategori').value,
            status_properti: document.querySelector('input[name="statusProperti"]:checked').value,
            nama_pemilik: document.getElementById('namaPemilik').value,
            kontak_pemilik: document.getElementById('kontakPemilik').value,
            nama_makelar: document.getElementById('namaMakelar').value,
            kontak_makelar: document.getElementById('kontakMakelar').value,
            foto_urls: ["https://example.com/foto1.jpg"],
            latitude: -6.12345,
            longitude: 106.12345,
            wilayah_lengkap: document.getElementById('wilayahText').innerText,
            harga: document.getElementById('hargaProperti').value,
            ringkasan: document.getElementById('ringkasan').value,
            catatan: document.getElementById('catatan').value,
            status_listing: statusListingVal,
            status_followup: statusListingVal === 'Sold' ? '' : document.querySelector('input[name="statusFollowup"]:checked').value,
            status_leads: statusListingVal === 'Sold' ? '' : document.querySelector('input[name="statusLeads"]:checked').value
        };

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tg.sendData(JSON.stringify(payload));
            tg.close();
        } else {
            console.log("Payload:", payload);
            alert("Data siap dikirim (Testing Mode)");
        }
    }
</script>
</body>
</html>
